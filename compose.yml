name: tixo

x-app: &app
  build:
    context: .
    args:
      VERSION: ${VERSION:-dev}
  image: tixo:local
  environment:
    APP_ENV: ${APP_ENV:-dev}
    HTTP_ADDR: ":8080"
    BASE_URL: ${BASE_URL:-http://localhost:8080}
    DATABASE_URL: postgres://${POSTGRES_USER:-tixo}:${POSTGRES_PASSWORD:-tixo}@postgres:5432/${POSTGRES_DB:-tixo}?sslmode=disable
    DB_MAX_CONNS: ${DB_MAX_CONNS:-10}
    REDIS_URL: redis://redis:6379/0
    AMQP_URL: amqp://${RABBITMQ_USER:-tixo}:${RABBITMQ_PASSWORD:-tixo}@rabbitmq:5672/
    SESSION_SECRET: ${SESSION_SECRET:-}
    GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    STORAGE_DIR: /data/uploads
    HUBSPOT_ACCESS_TOKEN: ${HUBSPOT_ACCESS_TOKEN:-}
    CRM_DRY_RUN: ${CRM_DRY_RUN:-true}

services:
  postgres:
    image: postgres:16-alpine
    shm_size: 256mb
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tixo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tixo}
      POSTGRES_DB: ${POSTGRES_DB:-tixo}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--save", "60", "1"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-tixo}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-tixo}
    ports:
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 20
    restart: unless-stopped

  migrate:
    <<: *app
    command: ["migrate", "up"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  serve:
    <<: *app
    command: ["serve"]
    ports:
      - "${HTTP_PORT:-8080}:8080"
    volumes:
      - uploads:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/tixo", "probe"]
      interval: 10s
      timeout: 5s
      start_period: 5s
      retries: 3
    restart: unless-stopped

  worker:
    <<: *app
    command: ["worker"]
    volumes:
      - uploads:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  worker-crm:
    <<: *app
    command: ["worker", "--queue=crm.contact"]
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  scheduler:
    <<: *app
    command: ["scheduler"]
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  rabbitdata:
  uploads:
