name: tixo

x-app: &app
  image: ghcr.io/kotunoleg/tixo:${TIXO_IMAGE_TAG:-latest}
  environment:
    APP_ENV: ${APP_ENV:-prod}
    HTTP_ADDR: ":8080"
    BASE_URL: https://${DOMAIN:?DOMAIN is required}
    DATABASE_URL: postgres://${POSTGRES_USER:-tixo}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-tixo}?sslmode=disable
    DB_MAX_CONNS: ${DB_MAX_CONNS:-10}
    REDIS_URL: redis://redis:6379/0
    AMQP_URL: amqp://${RABBITMQ_USER:-tixo}:${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}@rabbitmq:5672/
    SESSION_SECRET: ${SESSION_SECRET:-}
    GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    STORAGE_DIR: /data/uploads
  logging: &logging
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tixo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-tixo}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging: *logging
    restart: unless-stopped

  redis:
    image: redis:8.10-alpine
    command: ["redis-server", "--save", "60", "1"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging: *logging
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4.4-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-tixo}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}
    volumes:
      - rabbitdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 20
    logging: *logging
    restart: unless-stopped

  migrate:
    <<: *app
    command: ["migrate", "up"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  serve:
    <<: *app
    command: ["serve"]
    volumes:
      - uploads:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/tixo", "probe"]
      interval: 10s
      timeout: 5s
      start_period: 5s
      retries: 3
    restart: unless-stopped

  caddy:
    image: caddy:2.11-alpine
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN is required}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - serve
    logging: *logging
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  rabbitdata:
  uploads:
  caddy_data:
  caddy_config:
