{{define "footer"}}<footer class="tixo-footer mt-auto py-5">
  <div class="container">
    <div class="d-flex flex-wrap justify-content-between gap-4">
      <div>
        <a class="d-inline-flex align-items-center gap-2 text-decoration-none mb-2" href="{{.URL "/"}}">
          <img src="/static/img/logo.svg" alt="" width="28" height="28">
          <span class="tixo-wordmark fs-5">{{.T "site.name"}}</span>
        </a>
        <p class="text-body-secondary small mb-0">{{.T "site.tagline"}}</p>
      </div>
      <div>
        <h2 class="h6 text-body-secondary mb-2">{{.T "footer.language"}}</h2>
        <a class="small" href="{{.SwitchURL}}" hreflang="{{.OtherLang}}" lang="{{.OtherLang}}">{{.T "lang.switch"}}</a>
      </div>
    </div>
    <hr class="my-4">
    <p class="small text-body-secondary mb-0">{{.T "footer.rights" "Year" .Year}}</p>
  </div>
</footer>{{end}}
