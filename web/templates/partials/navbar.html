{{define "navbar"}}<nav class="navbar navbar-expand-lg sticky-top tixo-navbar" aria-label="{{.T "nav.main"}}">
  <div class="container">
    <a class="navbar-brand d-flex align-items-center gap-2" href="{{.URL "/"}}">
      <img src="/static/img/logo.svg" alt="" width="32" height="32">
      <span class="tixo-wordmark">{{.T "site.name"}}</span>
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav-main" aria-controls="nav-main" aria-expanded="false" aria-label="{{.T "nav.toggle"}}">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="nav-main">
      <ul class="navbar-nav me-auto">
        {{if or .Viewer .SignIn}}<li class="nav-item"><a class="nav-link"{{if .Current "/org"}} aria-current="page"{{end}} href="{{.URL "/org"}}">{{.T "nav.organizers"}}</a></li>{{end}}
      </ul>
      <div class="tixo-nav-actions d-flex flex-wrap align-items-center gap-2">
        <a class="btn btn-sm btn-quiet" href="{{.SwitchURL}}" hreflang="{{.OtherLang}}" lang="{{.OtherLang}}">{{.T "lang.switch"}}</a>
        {{if .Viewer}}
        <div class="dropdown">
          <button class="btn btn-sm btn-quiet dropdown-toggle tixo-account-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false">
            <span class="visually-hidden">{{.T "nav.account"}} </span><span class="tixo-viewer-name">{{.Viewer.Name}}</span>
          </button>
          <ul class="dropdown-menu dropdown-menu-end tixo-account-menu">
            <li class="dropdown-item-text">
              <span class="d-block fw-semibold text-break">{{.Viewer.Name}}</span>
              <span class="d-block small text-body-secondary text-break">{{.Viewer.Email}}</span>
            </li>
            <li><hr class="dropdown-divider"></li>
            <li><a class="dropdown-item" href="{{.URL "/org"}}">{{.T "nav.my_organizers"}}</a></li>
            <li>
              <form method="post" action="{{.URL "/auth/logout"}}">
                <button class="dropdown-item" type="submit">{{.T "nav.sign_out"}}</button>
              </form>
            </li>
          </ul>
        </div>
        {{else if .SignIn}}
        <a class="btn btn-sm btn-tixo" href="{{.URL "/auth/google/login"}}?next={{.Here}}"><i class="bi bi-google me-1" aria-hidden="true"></i>{{.T "nav.sign_in"}}</a>
        {{end}}
      </div>
    </div>
  </div>
</nav>{{end}}
