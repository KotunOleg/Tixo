{{define "title"}}{{.T "auth.error.title"}} · {{.T "site.name"}}{{end}}
{{define "content"}}
<section class="container py-5 tixo-error">
  <h1 class="mb-3">{{.T "auth.error.title"}}</h1>
  <p class="text-body-secondary mb-4">{{.T .Data.MessageID}}</p>
  <div class="d-flex flex-wrap gap-2">
    <a class="btn btn-tixo" href="{{.URL "/auth/google/login"}}{{with .Data.Next}}?next={{.}}{{end}}"><i class="bi bi-google me-1" aria-hidden="true"></i>{{.T "auth.error.retry"}}</a>
    <a class="btn btn-quiet" href="{{.URL "/"}}">{{.T "errors.back_home"}}</a>
  </div>
</section>
{{end}}
