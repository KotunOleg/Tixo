[site]
name = "Tixo"
tagline = "Концерти, лекції та мітапи поруч із тобою"
meta_description = "Tixo — шукай концерти, лекції та мітапи на мапі або з ШІ-помічником і купуй квитки за хвилину."

[a11y]
