[home.how]
title = "Як це працює"

[home.how.map]
title = "Шукай на мапі"
text = "Усі майданчики міста з фільтрами за датою, жанром і ціною."

[home.how.agent]
title = "Спитай ШІ-помічника"
text = "Опиши, що хочеш, звичайними словами — помічник підбере події й допоможе з квитком."

[home.how.tickets]
title = "Електронний квиток"
text = "Після оплати отримуєш PDF із QR-кодом і нагадування в Telegram."

[home.organizers]
title = "Організовуєте події?"
text = "Створюйте афішу, продавайте квитки й дивіться аналітику продажів в одному місці."
cta = "Почати як організатор"

[footer]
language = "Мова"
rights = "© {{.Year}} Tixo. Курсовий проєкт «Web-технології»."

