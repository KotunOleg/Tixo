[site]
name = "Tixo"
tagline = "Концерти, лекції та мітапи поруч із тобою"
meta_description = "Tixo — шукай концерти, лекції та мітапи на мапі або з ШІ-помічником і купуй квитки за хвилину."

[a11y]
skip = "Перейти до вмісту"

[nav]
events = "Події"
map = "Мапа"
organizers = "Організаторам"
sign_in = "Увійти"
toggle = "Відкрити меню"
my_organizers = "Мої організатори"
sign_out = "Вийти"
account = "Акаунт"

[lang]
switch = "English"
switch_short = "EN"
suggest = "Looks like you prefer English. Switch to the English version?"
suggest_accept = "Switch to English"
suggest_dismiss = "Залишитися"

[home]
title = "Tixo — квитки на концерти, лекції та мітапи"

[home.hero]
kicker = "Квитки на події"
title = "Знайди свою подію сьогодні ввечері"
subtitle = "Концерти, лекції та мітапи на мапі міста. Обирай за жанром, датою й ціною або просто спитай ШІ-помічника."

[home.search]
label = "Пошук подій"
placeholder = "Джаз у Києві на вихідних…"
submit = "Знайти"

[home.upcoming]
title = "Найближчі події"
all = "Усі події"
empty_title = "Подій поки немає"
empty_text = "Організатори вже готують афішу. Загляньте трохи згодом."
organizer_cta = "Ви організатор? Створіть подію"

[home.how]
title = "Як це працює"

[home.how.map]
title = "Шукай на мапі"
text = "Усі майданчики міста з фільтрами за датою, жанром і ціною."

[home.how.agent]
title = "Спитай ШІ-помічника"
text = "Опиши, що хочеш, звичайними словами — помічник підбере події й допоможе з квитком."

[home.how.tickets]
title = "Електронний квиток"
text = "Після оплати отримуєш PDF із QR-кодом і нагадування в Telegram."

[home.organizers]
title = "Організовуєте події?"
text = "Створюйте афішу, продавайте квитки й дивіться аналітику продажів в одному місці."
cta = "Почати як організатор"

[footer]
explore = "Огляд"
language = "Мова"
rights = "© {{.Year}} Tixo. Курсовий проєкт «Web-технології»."

[errors]
back_home = "На головну"
request_id = "Код запиту: {{.ID}}"

[errors.404]
title = "Сторінку не знайдено"
text = "Можливо, подію перенесли або посилання застаріло."

[errors.500]
title = "Щось пішло не так"
text = "Ми вже бачимо помилку. Спробуйте ще раз за хвилину."

[auth.error]
title = "Не вдалося увійти"
state = "Сеанс входу застарів або посилання підроблене. Спробуйте увійти ще раз."
provider = "Google зараз не відповідає. Спробуйте ще раз за хвилину."
unverified = "Google не підтвердив адресу пошти цього акаунта. Підтвердіть її в Google і спробуйте знову."
taken = "Ця адреса пошти вже прив'язана до іншого акаунта Google."
retry = "Увійти ще раз"

[auth.flash]
cancelled = "Вхід скасовано."

[flash]
close = "Закрити"
