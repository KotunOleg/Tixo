[home]
title = "Tixo — квитки на концерти, лекції та мітапи"

[home.hero]
kicker = "Квитки на події"
title = "Знайди свою подію сьогодні ввечері"
subtitle = "Концерти, лекції та мітапи на мапі міста. Обирай за жанром, датою й ціною або просто спитай ШІ-помічника."

[home.search]
