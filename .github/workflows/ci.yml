name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: golangci-lint
        run: go tool golangci-lint run ./...
      - name: sqlc generated code is up to date
        run: go tool sqlc diff

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tixo
          POSTGRES_PASSWORD: tixo
          POSTGRES_DB: tixo_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tixo -d tixo_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
      rabbitmq:
        image: rabbitmq:4-alpine
        env:
          RABBITMQ_DEFAULT_USER: tixo
          RABBITMQ_DEFAULT_PASS: tixo
        ports: ["5672:5672"]
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://tixo:tixo@localhost:5432/tixo_test?sslmode=disable
      TEST_REDIS_URL: redis://localhost:6379/1
      TEST_AMQP_URL: amqp://tixo:tixo@localhost:5672/
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: go test
        run: go test -race -count=1 ./...

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: build image
        run: docker build --build-arg VERSION=${{ github.sha }} -t tixo:ci .
